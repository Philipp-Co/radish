; supervisord uebernimmt hier die Rolle, die frueher (vor dem Umbau auf
; game-server-admin, siehe README.md) der Shell-Trap im Entrypoint selbst
; gespielt hat: Prozesse im Container am Leben halten und bei Absturz neu
; starten. Zwei Programme:
;
;   django          -- die Admin-Oberflaeche (radish/game-server/)
;   game-instance-1 -- ein Paar zucchini_server + radish_server, siehe
;                       game-instance-entrypoint.sh
;
; Nur eine Instanz, nicht vier: zucchini_server hat Instanzname ("zucchini")
; und UDP-Port (9999) fest einkompiliert (siehe server/src/main.c,
; server/src/server.c im zucchini-Repo) und kann deshalb aktuell nur einmal
; pro Container laufen. Sobald das parametrisierbar ist, kommen
; game-instance-2/-3/-4 als weitere [program:...]-Sektionen dazu, jede mit
; eigenem ZUC_INSTANCE_NAME/Port an game-instance-entrypoint.sh uebergeben.
[supervisord]
nodaemon=true
user=root
loglevel=info
; Kein eigenes Logfile: supervisord selbst loggt auf stdout/stderr des
; Containers, damit "docker logs" alles sieht, ohne eine Datei im Image zu
; pflegen.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; supervisorctl fuer die Fehlersuche im laufenden Container
; (docker exec ... supervisorctl status), ueber einen Unix-Socket statt TCP --
; das muss von aussen nicht erreichbar sein.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:django]
directory=/app
command=python manage.py runserver 0.0.0.0:8000 --noreload
; --noreload: der Autoreloader des Dev-Servers forkt sich selbst neu und
; wuerde supervisord vortaeuschen, das Programm sei beendet -- doppelte
; Neustarts. Ein Absturz des eigentlichen Servers bleibt trotzdem ein
; Absturz und startet ueber autorestart neu.
autostart=true
autorestart=true
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:game-instance-1]
command=/usr/local/bin/game-instance-entrypoint.sh zucchini
; Der Name ist hier noch reine Dokumentation der Absicht: radish_server
; liest ihn zwar aus argv[1] (siehe radish/game-server-core/src/main.c),
; zucchini_server ignoriert argv bislang komplett und laeuft immer als
; "zucchini" auf Port 9999 (siehe Kommentar oben). Sobald das behoben ist,
; wird hier ein echter, pro Instanz eindeutiger Name stehen.
autostart=true
autorestart=true
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
