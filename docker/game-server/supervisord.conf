; supervisord uebernimmt hier die Rolle, die frueher (vor dem Umbau auf
; game-server-admin, siehe README.md) der Shell-Trap im Entrypoint selbst
; gespielt hat: Prozesse im Container am Leben halten und bei Absturz neu
; starten. Fuenf Programme:
;
;   django                 -- die Admin-Oberflaeche (radish/game-server/)
;   game-instance-1 bis -4 -- je ein Paar zucchini_server + radish_server,
;                             siehe game-instance-entrypoint.sh
;
; Je Instanz ein [program:...]-Abschnitt. Name und UDP-Port der Instanz
; werden nur hier festgelegt, als Paar an game-instance-entrypoint.sh
; uebergeben und von dort an zucchini_server, radish_server, Django und das
; Backend durchgereicht. Der Name ist der Programmname (%(program_name)s),
; damit beides nicht auseinanderlaufen kann; supervisord haelt ihn ohnehin
; eindeutig. Der Port muss es auch sein -- das prueft hier niemand, ein
; doppelter faellt erst auf, wenn zucchini_server ihn nicht binden kann.
; Die Ports laufen fortlaufend ab 9999 (game-instance-N auf 9998+N); dieselbe
; Spanne steht im Dockerfile (EXPOSE) und in docker-compose.yaml (ports:).
; Eine weitere Instanz ist ein weiterer Abschnitt mit dem naechsten Port,
; dazu die Spanne an beiden Stellen erweitert.
[supervisord]
nodaemon=true
user=root
loglevel=info
; Kein eigenes Logfile: supervisord selbst loggt auf stdout/stderr des
; Containers, damit "docker logs" alles sieht, ohne eine Datei im Image zu
; pflegen.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; supervisorctl fuer die Fehlersuche im laufenden Container
; (docker exec ... supervisorctl status), ueber einen Unix-Socket statt TCP --
; das muss von aussen nicht erreichbar sein.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:django]
directory=/app
command=python manage.py runserver 0.0.0.0:8000 --noreload
; --noreload: der Autoreloader des Dev-Servers forkt sich selbst neu und
; wuerde supervisord vortaeuschen, das Programm sei beendet -- doppelte
; Neustarts. Ein Absturz des eigentlichen Servers bleibt trotzdem ein
; Absturz und startet ueber autorestart neu.
autostart=true
autorestart=true
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:game-instance-1]
command=/usr/local/bin/game-instance-entrypoint.sh %(program_name)s 9999
autostart=true
autorestart=true
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

