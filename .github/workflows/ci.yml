# Pruefungen fuer jeden Push und jeden Pull Request: die C-Testsuite, Backend
# und game-server (Tests, mypy, pylint, lizard) und das Frontend (Lint, Tests,
# Build). Die vier Jobs laufen parallel und haengen nicht voneinander ab.
#
# Der Wasm-Client und die Docker-Images sind (noch) nicht dabei.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Ein neuer Push auf denselben Branch bricht den alten Lauf ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Host-Build von radish (radish/CMakeLists.txt ohne Emscripten) mit der
  # Unity-Suite und den Schema-Tests, ausgefuehrt von ctest.
  game:
    name: C-Tests (ctest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Die Bibliotheken liegen nicht im Repository, sondern als Klone neben
      # radish/ (siehe radish/cmake/*.cmake). Hier auf denselben Staenden wie
      # im Haupt-Checkout; beim Anheben eines Klons auch hier nachziehen.
      - name: Abhaengigkeiten klonen
        run: |
          clone() {  # <url> <verzeichnis> <commit>
            git init -q "$2"
            git -C "$2" fetch -q --depth 1 "$1" "$3"
            git -C "$2" checkout -q FETCH_HEAD
          }
          clone https://github.com/zserge/jsmn.git              jsmn       25647e692c7906b96ffd2b05ca54c097948e879c
          clone https://github.com/Philipp-Co/zucchini.git      zucchini   304cdcac6f8ca88c592219ad5665c0f4b30d592d
          clone https://github.com/protobuf-c/protobuf-c.git    protobuf-c 4719fdd7760624388c2c5b9d6759eb6a47490626
          clone https://github.com/ThrowTheSwitch/Unity.git     Unity      3a6eb6dfd7706b703adf60f5ce3bcad57f94de4f

      # protoc und protoc-gen-c als Host-Werkzeuge (radish/cmake/protobuf-c.cmake).
      - name: Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler protobuf-c-compiler

      # Ohne check-jsonschema fallen die Schema-Tests (schema_world*) still weg.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install check-jsonschema

      - name: Konfigurieren
        run: cmake -S radish -B build-host -DCMAKE_BUILD_TYPE=Debug

      - name: Bauen
        run: cmake --build build-host --parallel

      - name: Testen
        run: ctest --test-dir build-host --output-on-failure

  # Django-Backend (radish/backend/): die Werkzeuge aus seiner README, Abschnitt
  # "Code-Qualitaet", gegen eine Postgres wie in docker-compose.yaml.
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: radish/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: radish
          POSTGRES_USER: radish
          POSTGRES_PASSWORD: radish
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U radish -d radish"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Die Defaults aus config/database.py: Admin-Benutzer radish auf localhost:5433.
      PGPASSWORD: radish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: radish/backend/requirements*.txt

      - name: Abhaengigkeiten installieren
        id: install
        run: pip install -r requirements-dev.txt

      # Django legt die Testdatenbank als Kopie von template1 an. Die Tabellen
      # gehoeren ins Schema "radish" (search_path, config/database.py) -- das
      # muss es also schon in template1 geben.
      - name: Schema in template1 anlegen
        run: psql -h localhost -p 5433 -U radish -d template1 -c 'CREATE SCHEMA radish'

      - name: Tests
        run: python manage.py test api web

      - name: mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy api config web

      - name: pylint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pylint api config web

      - name: lizard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: scripts/lizard.sh

  # game-server (radish/game-server/): dieselben Werkzeuge wie im Backend. Ohne
  # eigene Datenbank (DATABASES ist leer, config/settings.py).
  game-server:
    name: game-server
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: radish/game-server
    steps:
      - uses: actions/checkout@v4

      # Python wie im Image (docker/game-server/Dockerfile).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: radish/game-server/requirements*.txt

      - name: Abhaengigkeiten installieren
        id: install
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python manage.py test instances

      - name: mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy config instances

      - name: pylint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pylint config instances

      - name: lizard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: scripts/lizard.sh

  # Angular-Frontend (radish/frontend/): Lint, Vitest-Tests und Produktivbuild.
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: radish/frontend
    steps:
      - uses: actions/checkout@v4

      # Node wie im Image (docker/backend/Dockerfile, Stage frontend-builder).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: radish/frontend/package-lock.json

      - name: Abhaengigkeiten installieren
        id: install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx ng test --watch=false

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build -- --configuration production
