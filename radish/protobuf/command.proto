syntax = "proto3";

message NetMoveCommandStep
{
    uint32 x = 1;
    uint32 y = 2;
}

// user_id ist die oeffentliche Id eines Spielers, die gepackte Spieler-Kennung
// (RAD_ControlUserIdFromIdentifier, game_start.h) -- sie braucht alle 64 Bit.
//
// Nur auf dem Rueckweg hat sie Gewicht: in der Antwort traegt sie, wer das
// Kommando geschickt hat, so dass jeder Client es zuordnen kann. Was ein Client
// beim Senden hineinschreibt, liest der Server nicht -- den Absender setzt das
// Backend vor die Nachricht (RAD_ParseSenderFromMessage, game-server-core/src/
// include/radish/server/interface/message.h). Ein Client darf das Feld leer
// lassen.
message NetMoveCommand
{
    uint64 user_id = 1;
    uint32 unit_id = 2;
    repeated NetMoveCommandStep steps = 3;
}

// Eine Einheit des Absenders greift das Feld (x, y) an (RAD_COMMAND_TYPE_ATTACK).
// Das Ziel ist ein Feld und keine Einheit: getroffen wird, was dort steht, auch
// ein leeres Feld ist ein gueltiges Ziel. Womit angegriffen wird, entscheidet die
// Kampfregel im Spiel. x und y wie bei NetDeployCommand: Weltkoordinaten, die in
// int16 passen. user_id wie bei NetMoveCommand: nur in der Antwort gesetzt.
message NetAttackCommand
{
    uint64 user_id = 1;
    uint32 unit_id = 2;
    uint32 x = 3;
    uint32 y = 4;
}

// Stellt eine Einheit aus der Reserve des Absenders auf das Feld (x, y)
// (RAD_COMMAND_TYPE_DEPLOY_UNIT). Die Einheit nennt ihre Id im Spiel; x und y sind
// Weltkoordinaten und passen in int16 -- was groesser ist, lehnt der Server ab.
// user_id wie bei NetMoveCommand: nur in der Antwort gesetzt.
message NetDeployCommand
{
    uint64 user_id = 1;
    uint32 unit_id = 2;
    uint32 x = 3;
    uint32 y = 4;
}

// Gibt den Zug des Absenders ab (RAD_COMMAND_TYPE_END_TURN). Traegt sonst
// nichts: wer abgibt, steht im Kopf der Nachricht. user_id wie bei
// NetMoveCommand: nur in der Antwort gesetzt. Wer danach dran ist, schickt der
// Server als eigenes Ereignis (NetCurrentPlayerEvent, game.proto).
message NetEndTurnCommand
{
    uint64 user_id = 1;
}

message NetCommandRequest
{
    uint32 id = 1;
    // 3 war NetShootCommand (Ziel eine Einheit); frei gehalten, damit eine alte
    // Nachricht nicht als etwas anderes gelesen wird.
    reserved 3;
    reserved "shoot";

    oneof commands 
    {
        NetMoveCommand move = 2;
        NetDeployCommand deploy = 4;
        NetEndTurnCommand end_turn = 5;
        NetAttackCommand attack = 6;
    }
}

message NetCommandResponse
{
    NetCommandRequest command = 1;
    bool success = 2;
    string description = 3;
}

