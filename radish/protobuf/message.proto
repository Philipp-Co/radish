syntax = "proto3";

import "event.proto";
import "command.proto";
import "discover.proto";

message NetUserRequest
{
    oneof data
    {
        NetCommandRequest command_request = 1;
        NetDiscoverRequest discover_request = 2;
    }
}

message NetServerMessage
{
    oneof data
    {
        NetCommandResponse command_response = 1;
        NetEvent event = 2;
    } 
}
