syntax = "proto3";

// VOID kam als letzter dazu und steht deshalb hinten: bestehende Nummern
// werden nicht umgedeutet. Ein Feld ohne Gelaende ist ein Feld und kein
// fehlendes -- es gehoert zur Welt (RAD_TILE_TYPE_VOID) und wird genauso
// uebertragen wie eines mit.
//
// WATER ist das seichte Wasser (RAD_TILE_TYPE_WATER_SHALLOW); der Name blieb,
// damit sich die Nummer nicht umdeutet. Alles ab 4 kam spaeter dazu.
enum NetTileType
{
    TILE_TYPE_UNKNOWN = 0;
    TILE_TYPE_GROUND = 1;
    TILE_TYPE_WATER = 2;
    TILE_TYPE_VOID = 3;
    TILE_TYPE_MUD = 4;
    TILE_TYPE_MEADOW = 5;
    TILE_TYPE_FOREST = 6;
    TILE_TYPE_WATER_DEEP = 7;
    TILE_TYPE_CITY = 8;
    TILE_TYPE_ROAD = 9;
    TILE_TYPE_FORTIFICATION = 10;
}

message NetTile
{
    uint32 x = 2;
    uint32 y = 3;
    NetTileType type = 4;

    // Die Figur auf dem Feld, als Id des Spiels (RAD_UnitId_t) und
    // unveraendert: -1 heisst keine (RAD_UNIT_NONE), jede andere Zahl ist eine
    // Figur, die 0 eingeschlossen.
    //
    // sint32 und nicht int32: ein negativer int32 kostet auf der Strecke immer
    // zehn Bytes, und -1 steht auf fast jedem Feld. sint32 kodiert ihn in einem.
    // Kein "optional": protoc-gen-c (protobuf-c 1.5) erzeugt dafuer in proto3
    // keinen Code.
    sint32 unit_id = 5;

    // Hoehe des Feldes (RAD_Tile_t.z). Auf einem Feld ohne Gelaende 0.
    uint32 z = 6;

    // Ein Siegfeld (RAD_Tile_t.victory): wer es haelt, bekommt Punkte.
    bool victory = 7;

    // Was das Gelaende fuer das Spiel bedeutet (RAD_Tile_t.terrain), mit dem
    // Spielstart aus dem Katalog des Backends: MV, um wie viele Felder es die
    // Bewegungsreichweite aendert (sint32, weil es oft negativ ist), CV, die
    // Deckung, und ob eine Einheit das Feld betreten darf. Der Client rechnet
    // damit dieselben Wege wie der Server, statt eigene Werte zu fuehren.
    sint32 movement_modifier = 8;
    uint32 cover = 9;
    bool impassable = 10;
}

message NetTileCreatedEvent 
{
    NetTile tile = 1;
}

message NetTileRemovedEvent
{
    uint32 x = 1;
    uint32 y = 2;
}

message NetTileChangedEvent
{
    NetTile tile = 1;
}

message NetTileEvent
{
    oneof event
    {
        NetTileCreatedEvent created = 1;
        NetTileRemovedEvent removed = 2;
        NetTileChangedEvent changed = 3;
    }
}

