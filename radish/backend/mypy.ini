# Typpruefung fuer das Backend. Aufruf aus radish/backend/:
#   pip install -r requirements-dev.txt
#   mypy api config web

[mypy]
# Wie im Image (docker/backend/Dockerfile: python:3.14-alpine).
python_version = 3.14
# Damit mypy Django-Models, QuerySets und DRF-Serializer versteht.
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
# Generiert, nicht von Hand gepflegt.
exclude = (^|/)migrations/
# Jede Funktion braucht vollstaendige Type Hints (Parameter und Rueckgabe).
disallow_untyped_defs = True
disallow_incomplete_defs = True
# Ein "type: ignore", das nichts mehr unterdrueckt, soll auffallen.
warn_unused_ignores = True

[mypy.plugins.django-stubs]
# Das Plugin laedt die echten Settings -- dafuer muessen die Abhaengigkeiten
# aus requirements.txt installiert sein.
django_settings_module = config.settings

# Ohne eigene Typinformationen.
[mypy-channels.*]
ignore_missing_imports = True

[mypy-daphne.*]
ignore_missing_imports = True
