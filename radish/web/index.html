<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>WASM &lt;-&gt; Relay &lt;-&gt; Zucchini</title>
<style>
  body { font-family: sans-serif; max-width: 680px; margin: 2rem auto; background: #000; color: #ccc; }
  canvas { border: 1px solid #333; display: block; }
</style>
</head>
<body>
<h1>WASM &lt;-&gt; Relay &lt;-&gt; Zucchini</h1>
<canvas id="canvas" width="640" height="420" tabindex="0"></canvas>

<script src="client.js"></script>
<script>
const ZUCCHINI_CODE = 1;
const RELAY_SIGNALING_URL = "ws://localhost:8765";

const canvas = document.getElementById("canvas");
canvas.addEventListener("click", () => canvas.focus());

function forwardResponseToWasm(Module, buffer) {
  const bytes = new Uint8Array(buffer);
  const ptr = Module._malloc(bytes.length);
  Module.HEAPU8.set(bytes, ptr);
  Module.ccall("zuc_on_response", null, ["number", "number"], [ptr, bytes.length]);
  Module._free(ptr);
}

function notifyConnectionState(Module, state) {
  Module.ccall("zuc_on_connection_state", null, ["number"], [state]);
}

createZucchiniModule({
  canvas,
  print: console.log,
  printErr: console.error,
}).then((Module) => {
  const ws = new WebSocket(RELAY_SIGNALING_URL);
  let pc = null;
  let channel = null;

  Module.sendToChannel = (bytes) => {
    if (channel && channel.readyState === "open") {
      channel.send(bytes);
    }
  };

  ws.onopen = async () => {
    try {
      console.log("[debug] ws.onopen");

      pc = new RTCPeerConnection();
      pc.onconnectionstatechange = () => console.log("[debug] connectionState=" + pc.connectionState);
      pc.oniceconnectionstatechange = () => console.log("[debug] iceConnectionState=" + pc.iceConnectionState);

      channel = pc.createDataChannel("zucchini");
      channel.binaryType = "arraybuffer";

      channel.onopen = () => notifyConnectionState(Module, 1);
      channel.onclose = () => notifyConnectionState(Module, 2);
      channel.onerror = (e) => console.error("[debug] channel error:", e.error || e);
      channel.onmessage = (event) => forwardResponseToWasm(Module, event.data);

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      console.log("[debug] offer created, gathering ICE...");

      await new Promise((resolve) => {
        if (pc.iceGatheringState === "complete") {
          resolve();
          return;
        }
        pc.onicegatheringstatechange = () => {
          if (pc.iceGatheringState === "complete") {
            resolve();
          }
        };
      });

      console.log("[debug] sending offer over websocket");
      ws.send(JSON.stringify({ type: pc.localDescription.type, sdp: pc.localDescription.sdp }));
    } catch (e) {
      console.error("[error]", e);
    }
  };

  ws.onmessage = async (event) => {
    try {
      const answer = JSON.parse(event.data);
      await pc.setRemoteDescription(answer);
      console.log("[debug] remote description set");
    } catch (e) {
      console.error("[error] onmessage:", e);
    }
  };

  ws.onerror = () => console.error("[error] ws.onerror");
  ws.onclose = (e) => console.log("[debug] ws.onclose code=" + e.code + " reason=" + e.reason);
});
</script>
</body>
</html>
