# Typpruefung fuer den game-server. Aufruf aus radish/game-server/:
#   pip install -r requirements-dev.txt
#   mypy config instances

[mypy]
# Wie im Image (docker/game-server/Dockerfile: python:3.12-alpine).
python_version = 3.12
# Damit mypy Django-Models und DRF versteht.
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
# Generiert, nicht von Hand gepflegt.
exclude = (^|/)migrations/
# Jede Funktion braucht vollstaendige Type Hints (Parameter und Rueckgabe).
disallow_untyped_defs = True
disallow_incomplete_defs = True
# Ein "type: ignore", das nichts mehr unterdrueckt, soll auffallen.
warn_unused_ignores = True

[mypy.plugins.django-stubs]
# Das Plugin laedt die echten Settings -- dafuer muessen die Abhaengigkeiten
# aus requirements.txt installiert sein.
django_settings_module = config.settings
