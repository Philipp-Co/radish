services:
  # Das Django-Backend unter radish/backend/: Matchmaking-API (Game/GameServer/
  # Player) sowie Login/Logout und JWT-Absicherung gegen Keycloak (siehe
  # radish/backend/api/auth_views.py, api/authentication.py). Redet nicht mit
  # game-server -- das uebernehmen die Clients selbst per UDP/WebRTC, dieser
  # Service verwaltet nur, wer mit wem in welchem Spiel steckt. Liefert
  # ausserdem das komplette Frontend aus: das Angular-Frontend
  # (radish/frontend/, wird im Image mitgebaut) unter "/" und den Wasm-Client
  # (radish/web/) unter "/wasm/" (siehe radish/backend/web/, docker/backend/
  # Dockerfile) -- kein eigener nginx-Container mehr dafuer.
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: radish-backend:alpine
    environment:
      # KEYCLOAK_BASE_URL bleibt die von aussen erreichbare Adresse (fuer
      # Redirects zum Browser und die Issuer-Pruefung, siehe settings.py);
      # KEYCLOAK_INTERNAL_BASE_URL nutzt stattdessen den Service-Namen fuer
      # die serverseitigen Aufrufe (Code-Tausch, userinfo, JWKS).
      KEYCLOAK_BASE_URL: "http://localhost:8081"
      KEYCLOAK_INTERNAL_BASE_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "radish"
      KEYCLOAK_CLIENT_ID: "radish-backend"
      KEYCLOAK_CLIENT_SECRET: "radish-backend-dev-secret"
      KEYCLOAK_REDIRECT_URI: "http://localhost:8000/api/login/callback/"
      KEYCLOAK_POST_LOGOUT_REDIRECT_URI: "http://localhost:8000/"
      # Postgres statt sqlite (siehe Service "backend-db" unten und
      # settings.py) -- backend-db ist der Servicename im Docker-Netzwerk,
      # von aussen (z.B. lokales manage.py) unter localhost:5433 erreichbar.
      DJANGO_DB_HOST: "backend-db"
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_NAME: "radish"
      DJANGO_DB_USER: "radish"
      DJANGO_DB_PASSWORD: "radish"
    ports:
      - "8000:8000"
    depends_on:
      - keycloak
      - backend-db
    restart: unless-stopped

  # Postgres fuer das Django-Backend (siehe Service "backend" oben) --
  # ersetzt die bisherige sqlite-Datei. Eigene Instanz statt Mitbenutzung
  # von keycloak-db: Backend und Keycloak sollen unabhaengig voneinander
  # zurueckgesetzt/skaliert werden koennen, und ein DB-Schema-Fehler im
  # einen darf nie den jeweils anderen Dienst gefaehrden.
  backend-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radish
      POSTGRES_USER: radish
      POSTGRES_PASSWORD: radish
    volumes:
      - backend-postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  # Django-Backend unter radish/game-server/ (frueher game-server-admin):
  # Betriebs-Oberflaeche fuer die Game-Server-Instanzen auf diesem Host --
  # nicht zu verwechseln mit "backend" oben, das ist die Matchmaking-API
  # (Game/GameServer/Player). Baut denselben C-Quellcode wie frueher der
  # einzelne Container "game-server" mit ein (siehe radish/game-server-core/,
  # docker/game-server/Dockerfile). Faehrt Django und eine Game-Instanz
  # nebeneinander unter supervisord (siehe docker/game-server/supervisord.conf),
  # das beide bei Absturz neu startet -- der alte Einzel-Instanz-Container
  # ist deshalb entfallen.
  #
  # Django selbst ist noch eine leere Huelle (siehe Kommentar in
  # config/settings.py): kein Modell, keine View, keine Instanzverwaltung
  # *durch* Django. Und noch eine einzelne statt vier Instanzen: der
  # UDP-Port unten ist deshalb schon auf 9999 gemappt, aber
  # zucchini_server hat Instanzname/Port fest einkompiliert und kann noch
  # nicht mehrfach im selben Container laufen (siehe supervisord.conf).
  game-server:
    build:
      context: .
      dockerfile: docker/game-server/Dockerfile
    image: radish-game-server:alpine
    environment:
      # Fuer register_instance.py (siehe docker/game-server/): meldet die
      # laufende Instanz beim Backend an-/ab (POST/DELETE api/servers/,
      # siehe radish/backend/api/server_views.py). Programm-eigene
      # Variablen, deshalb mit RADISH_ prefixed -- anders als z.B.
      # KEYCLOAK_BASE_URL beim Service "backend" oben, das folgt Keycloaks
      # eigener Konvention.
      RADISH_BACKEND_URL: "http://backend:8000"
      # Voller Token-Endpunkt statt Basis-URL + Realm getrennt (anders als
      # KEYCLOAK_BASE_URL/KEYCLOAK_REALM beim Service "backend"): dieser
      # Container braucht nur genau diesen einen Endpunkt.
      RADISH_KEYCLOAK_TOKEN_URL: "http://keycloak:8080/realms/radish/protocol/openid-connect/token"
      # Service-Account-Client mit Client-Credentials-Grant (siehe
      # docker/keycloak/realm-radish.json, Client "radish-game-server",
      # Rolle "Technischer-User-Server") -- kein Nutzer-Login, kein
      # Passwort. Secret hier wie ueberall in diesem Compose-File ein
      # reiner Dev-Wert.
      RADISH_KEYCLOAK_CLIENT_ID: "radish-game-server"
      RADISH_KEYCLOAK_CLIENT_SECRET: "radish-game-server-dev-secret"
      # Eindeutiger Name, unter dem sich diese Instanz beim Backend meldet
      # (GameServer.name ist unique, siehe radish/backend/api/models.py) --
      # unabhaengig vom Zucchini-Instanznamen (siehe
      # game-instance-entrypoint.sh).
      RADISH_GAME_SERVER_NAME: "game-instance-1"
      # Bewusst keine automatische Ermittlung der eigenen Container-IP:
      # die waere nur innerhalb dieses Docker-Netzes gueltig. Hier muss die
      # tatsaechlich von aussen erreichbare Adresse dieser Instanz stehen --
      # der Platzhalter unten passt nur fuer rein lokales docker compose up
      # und muss fuer einen echten Host angepasst werden.
      RADISH_GAME_SERVER_IP: "127.0.0.1"
      RADISH_GAME_SERVER_PORT: "9999"
    ports:
      - "8090:8000"
      - "9999:9999/udp"
    depends_on:
      - keycloak
      - backend
    restart: unless-stopped

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Keycloak 26 nutzt bereits das neuere "hostname:v2"-Modell (siehe Startup-Log:
      # "Hostname v1 options [hostname-port, hostname-strict-backchannel,
      # hostname-strict-https] are still in use, please review your configuration").
      # Die alten v1-Optionen (hostname-port/-strict-https/-strict-backchannel)
      # werden dabei nur mit einer Warnung ignoriert, nicht angewendet. Fuer v2
      # muss KC_HOSTNAME eine volle URL sein (nicht nur der Hostname).
      KC_HOSTNAME: "http://localhost:8081"
      # v2-Pendant zu hostname-strict-backchannel: erzwingt, dass auch Backchannel-
      # Antworten (Token-/Userinfo-Endpunkt bei Client-Credentials-Aufrufen ohne
      # Browser) die feste KC_HOSTNAME-URL als "iss"-Klaim verwenden. Ohne dies
      # uebernimmt Keycloak dafuer Host+Port des tatsaechlich benutzten Pfads --
      # z.B. "http://keycloak:8080/..." beim internen Aufruf aus
      # register_instance.py im game-server-Container -- was nicht mehr zu
      # ISSUER in radish/backend/config/settings.py (KEYCLOAK_BASE_URL, extern
      # http://localhost:8081) passt und jedes sonst gueltige Token als
      # "invalid or expired" ablehnen laesst.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak/realm-radish.json:/opt/keycloak/data/import/realm-radish.json
    depends_on:
      - keycloak-db
    restart: unless-stopped

volumes:
  keycloak-db-data:
  backend-postgres-data:
